<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
>

<meta name="theme-color" content="#b40000">

<title>PROJECT E-SAFE QR Scanner</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
  padding:0;
  overflow:hidden;
  background:#000;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  position:fixed;
  inset:0;
}

button,
select{
  font:inherit;
}

#app{
  position:fixed;
  inset:0;
  width:100vw;
  height:100dvh;
  min-height:100vh;
  overflow:hidden;
  background:#000;
}

/* =========================================================
   HEADER
========================================================= */

#header{
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:72px;
  z-index:50;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:
    env(safe-area-inset-top)
    14px
    10px
    14px;

  min-height:72px;

  background:rgba(0,0,0,.72);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);

  color:#fff;
}

#titleArea{
  display:flex;
  flex-direction:column;
  min-width:0;
}

#appTitle{
  font-size:18px;
  font-weight:900;
  line-height:1.1;
  white-space:nowrap;
}

#statusText{
  margin-top:4px;
  font-size:11px;
  color:#ddd;
  white-space:nowrap;
}

#closeBtn{
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.16);
  color:#fff;
  font-size:25px;
  font-weight:700;
  cursor:pointer;
}

/* =========================================================
   CAMERA
========================================================= */

#reader{
  position:absolute;
  inset:0;
  width:100vw;
  height:100dvh;
  min-height:100vh;
  overflow:hidden;
  background:#000;
}

#reader video{
  width:100% !important;
  height:100% !important;
  object-fit:cover !important;
}

#reader canvas{
  display:none !important;
}

/* Hide html5-qrcode default UI */
#reader__dashboard{
  display:none !important;
}

#reader__scan_region{
  width:100% !important;
  height:100% !important;
  border:0 !important;
}

#reader__scan_region img{
  display:none !important;
}

/* =========================================================
   SCAN FRAME
========================================================= */

#scanOverlay{
  position:absolute;
  inset:0;
  z-index:20;
  pointer-events:none;
}

#scanFrame{
  position:absolute;

  left:50%;
  top:50%;

  width:min(76vw,360px);
  height:min(76vw,360px);

  transform:translate(-50%,-50%);

  border:3px solid #fff;
  border-radius:24px;

  box-shadow:
    0 0 0 9999px rgba(0,0,0,.36),
    0 0 25px rgba(255,255,255,.35);
}

.corner{
  position:absolute;
  width:38px;
  height:38px;
  border-color:#ffdf00;
  border-style:solid;
}

.corner.tl{
  top:-3px;
  left:-3px;
  border-width:6px 0 0 6px;
  border-radius:20px 0 0 0;
}

.corner.tr{
  top:-3px;
  right:-3px;
  border-width:6px 6px 0 0;
  border-radius:0 20px 0 0;
}

.corner.bl{
  bottom:-3px;
  left:-3px;
  border-width:0 0 6px 6px;
  border-radius:0 0 0 20px;
}

.corner.br{
  bottom:-3px;
  right:-3px;
  border-width:0 6px 6px 0;
  border-radius:0 0 20px 0;
}

#scanHint{
  position:absolute;
  top:calc(50% + min(38vw,180px) + 22px);
  left:50%;
  transform:translateX(-50%);

  width:90%;
  text-align:center;

  color:#fff;
  font-size:14px;
  font-weight:700;

  text-shadow:0 2px 4px #000;
}

/* =========================================================
   BOTTOM CONTROLS
========================================================= */

#controls{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  z-index:50;

  padding:
    12px
    14px
    calc(14px + env(safe-area-inset-bottom))
    14px;

  background:linear-gradient(
    to top,
    rgba(0,0,0,.94),
    rgba(0,0,0,.72),
    rgba(0,0,0,0)
  );
}

.controlRow{
  display:flex;
  gap:8px;
  width:100%;
}

.controlGroup{
  flex:1;
  min-width:0;
}

.controlLabel{
  color:#fff;
  font-size:10px;
  font-weight:800;
  margin-bottom:5px;
  text-transform:uppercase;
}

select,
.actionBtn{
  width:100%;
  height:46px;

  border:0;
  border-radius:12px;

  padding:0 12px;

  font-size:14px;
  font-weight:800;
}

select{
  background:#fff;
  color:#111;
}

.actionBtn{
  background:#b40000;
  color:#fff;
}

.actionBtn:active{
  transform:scale(.98);
}

#startBtn{
  background:#078a35;
}

#stopBtn{
  background:#444;
}

.actionBtn:disabled{
  opacity:.45;
}

/* =========================================================
   API / CAMERA STATUS
========================================================= */

#connectionStatus{
  position:absolute;
  top:82px;
  left:50%;
  transform:translateX(-50%);

  z-index:60;

  padding:7px 12px;

  border-radius:20px;

  background:rgba(0,0,0,.65);
  color:#fff;

  font-size:11px;
  font-weight:700;

  white-space:nowrap;
}

/* =========================================================
   RESULT MODAL
========================================================= */

#resultModal{
  position:absolute;
  inset:0;
  z-index:100;

  display:none;
  align-items:center;
  justify-content:center;

  padding:20px;

  background:rgba(0,0,0,.76);
}

#resultCard{
  width:min(92vw,430px);
  max-height:85vh;
  overflow:auto;

  background:#fff;
  border-radius:24px;

  padding:24px 20px;

  text-align:center;

  box-shadow:0 20px 60px rgba(0,0,0,.5);
}

#resultIcon{
  width:74px;
  height:74px;

  margin:0 auto 14px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:38px;
  font-weight:900;

  background:#078a35;
  color:#fff;
}

#resultTitle{
  font-size:23px;
  font-weight:900;
  margin-bottom:8px;
}

#resultMessage{
  font-size:14px;
  line-height:1.5;
  color:#444;
  margin-bottom:16px;
}

#studentInfo{
  display:none;

  margin:12px 0;

  padding:14px;

  background:#f4f4f4;
  border-radius:14px;

  text-align:left;
}

.infoRow{
  display:flex;
  justify-content:space-between;
  gap:12px;

  padding:5px 0;

  font-size:13px;
}

.infoLabel{
  color:#777;
  font-weight:700;
}

.infoValue{
  color:#111;
  font-weight:900;
  text-align:right;
}

#resultCloseBtn{
  width:100%;
  height:48px;

  border:0;
  border-radius:14px;

  background:#b40000;
  color:#fff;

  font-size:15px;
  font-weight:900;
}

/* =========================================================
   LOADING
========================================================= */

#loading{
  position:absolute;
  inset:0;

  z-index:90;

  display:none;

  align-items:center;
  justify-content:center;

  background:rgba(0,0,0,.58);
}

.loadingBox{
  padding:20px 25px;
  border-radius:18px;
  background:#fff;
  text-align:center;
}

.spinner{
  width:40px;
  height:40px;

  margin:0 auto 12px;

  border:4px solid #ddd;
  border-top-color:#b40000;

  border-radius:50%;

  animation:spin .8s linear infinite;
}

.loadingText{
  font-size:14px;
  font-weight:800;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:380px){

  #header{

  }

  #appTitle{

  }

  .actionBtn,
  select{
    height:43px;
    font-size:12px;
  }

  #scanHint{
    font-size:12px;
  }

}

<script>

/* ==========================================================
   E-SAFE CONFIGURATION
========================================================== */

const API_URL =
  'https://script.google.com/macros/s/AKfycbwRW7wHP_Y6ZkZXdiDP8OrIqkV2e2f94pyEmrErNId80O1ODMUyKwTyE1uHF3BNDgk/exec';

const API_KEY =
  'ESAFE-SCANNER-2026-AIS-501538';

const SCANNER_NAME =
  'Standalone Mobile QR Scanner';

const QR_PREFIX =
  'ESAFE-';


/* ==========================================================
   SCANNER STATE
========================================================== */

let html5QrCode = null;

let scannerRunning = false;

let scanLocked = false;

let lastScannedToken = '';

let lastScanTime = 0;

const CLIENT_COOLDOWN_MS = 5000;


/* ==========================================================
   DOM
========================================================== */

const reader =
  document.getElementById('reader');

const cameraSelect =
  document.getElementById('cameraSelect');

const attendanceType =
  document.getElementById('attendanceType');

const startBtn =
  document.getElementById('startBtn');

const stopBtn =
  document.getElementById('stopBtn');

const connectionStatus =
  document.getElementById('connectionStatus');

const resultModal =
  document.getElementById('resultModal');

const resultIcon =
  document.getElementById('resultIcon');

const resultTitle =
  document.getElementById('resultTitle');

const resultMessage =
  document.getElementById('resultMessage');

const studentInfo =
  document.getElementById('studentInfo');

const loading =
  document.getElementById('loading');

const loadingText =
  document.getElementById('loadingText');


/* ==========================================================
   INITIALIZE
========================================================== */

document.addEventListener(
  'DOMContentLoaded',
  function(){

    checkApiHealth();

  }
);


/* ==========================================================
   API HEALTH CHECK
========================================================== */

function checkApiHealth(){

  setConnectionStatus(
    'API: CHECKING...'
  );

  jsonpRequest(
    {
      api:'scanner',
      action:'health',
      apiKey:API_KEY
    },
    function(response){

      if(
        response &&
        response.success === true
      ){

        setConnectionStatus(
          'API: CONNECTED'
        );

      }
      else{

        setConnectionStatus(
          'API: ERROR'
        );

        console.error(
          '[E-SAFE HEALTH ERROR]',
          response
        );

      }

    },
    function(error){

      setConnectionStatus(
        'API: OFFLINE'
      );

      console.error(
        '[E-SAFE HEALTH CONNECTION ERROR]',
        error
      );

    }
  );

}


/* ==========================================================
   CONNECTION STATUS
========================================================== */

function setConnectionStatus(text){

  connectionStatus.textContent =
    text;

}


/* ==========================================================
   JSONP REQUEST
========================================================== */

function jsonpRequest(
  params,
  onSuccess,
  onError
){

  const callbackName =
    '__esafe_jsonp_' +
    Date.now() +
    '_' +
    Math.floor(
      Math.random() * 100000
    );

  let script = null;

  let timeoutId = null;

  let finished = false;


  function cleanup(){

    if(timeoutId){

      clearTimeout(
        timeoutId
      );

    }

    try{

      delete window[
        callbackName
      ];

    }
    catch(e){

      window[
        callbackName
      ] = undefined;

    }

    if(script){

      script.onload = null;
      script.onerror = null;

      if(script.parentNode){

        script.parentNode.removeChild(
          script
        );

      }

    }

  }


  function finishSuccess(data){

    if(finished){

      return;

    }

    finished = true;

    cleanup();

    onSuccess(data);

  }


  function finishError(error){

    if(finished){

      return;

    }

    finished = true;

    cleanup();

    onError(error);

  }


  window[
    callbackName
  ] = function(data){

    finishSuccess(data);

  };


  const query =
    new URLSearchParams();


  Object.keys(params).forEach(
    function(key){

      if(
        params[key] !== undefined &&
        params[key] !== null
      ){

        query.set(
          key,
          String(params[key])
        );

      }

    }
  );


  query.set(
    'callback',
    callbackName
  );


  const requestUrl =
    API_URL +
    '?' +
    query.toString();


  console.log(
    '[E-SAFE JSONP REQUEST]',
    requestUrl
  );


  script =
    document.createElement(
      'script'
    );


  script.src =
    requestUrl;


  script.async = true;


  script.onerror =
    function(){

      finishError(
        new Error(
          'JSONP script failed to load.'
        )
      );

    };


  script.onload =
    function(){

      /*
       * IMPORTANT:
       *
       * JSONP may execute the callback
       * before onload fires.
       *
       * If callback already completed,
       * finished === true.
       *
       * Otherwise allow a short moment
       * for the callback.
       */

      setTimeout(
        function(){

          if(!finished){

            finishError(
              new Error(
                'API returned no JSONP callback.'
              )
            );

          }

        },
        100
      );

    };


  timeoutId =
    setTimeout(
      function(){

        finishError(
          new Error(
            'E-SAFE API request timed out.'
          )
        );

      },
      15000
    );


  document.body.appendChild(
    script
  );

}


/* ==========================================================
   GET CAMERAS
========================================================== */

async function getCameras(){

  try{

    const cameras =
      await Html5Qrcode.getCameras();


    console.log(
      '[E-SAFE AVAILABLE CAMERAS]',
      cameras
    );


    cameraSelect.innerHTML = '';


    if(
      !cameras ||
      cameras.length === 0
    ){

      const option =
        document.createElement(
          'option'
        );

      option.value = '';

      option.textContent =
        'No camera found';

      cameraSelect.appendChild(
        option
      );

      return [];

    }


    cameras.forEach(
      function(camera,index){

        const option =
          document.createElement(
            'option'
          );

        option.value =
          camera.id;

        let label =
          camera.label ||
          ('Camera ' + (index + 1));


        if(
          /back|rear|environment/i.test(
            label
          )
        ){

          label +=
            ' — REAR';

        }


        option.textContent =
          label;


        cameraSelect.appendChild(
          option
        );

      }
    );


    /*
     * Prefer rear/environment camera.
     */

    const rearCamera =
      cameras.find(
        function(camera){

          return /back|rear|environment/i.test(
            camera.label || ''
          );

        }
      );


    if(rearCamera){

      cameraSelect.value =
        rearCamera.id;

    }
    else{

      cameraSelect.value =
        cameras[0].id;

    }


    return cameras;

  }
  catch(error){

    console.error(
      '[E-SAFE CAMERA ENUMERATION ERROR]',
      error
    );

    throw error;

  }

}


/* ==========================================================
   START CAMERA
========================================================== */

async function startCamera(){

  if(scannerRunning){

    return;

  }


  try{

    startBtn.disabled =
      true;


    setConnectionStatus(
      'CAMERA: STARTING...'
    );


    /*
     * First request camera permission.
     *
     * This is important for mobile browsers.
     */

    const permissionStream =
      await navigator.mediaDevices.getUserMedia(
        {
          video:true,
          audio:false
        }
      );


    permissionStream
      .getTracks()
      .forEach(
        function(track){

          track.stop();

        }
      );


    const cameras =
      await getCameras();


    if(
      !cameras ||
      cameras.length === 0
    ){

      throw new Error(
        'No camera available.'
      );

    }


    const selectedCameraId =
      cameraSelect.value ||
      cameras[0].id;


    console.log(
      '[E-SAFE SELECTED CAMERA]',
      selectedCameraId
    );


    html5QrCode =
      new Html5Qrcode(
        'reader'
      );


    await html5QrCode.start(

      selectedCameraId,

      {
        fps:10,

        qrbox:function(
          viewfinderWidth,
          viewfinderHeight
        ){

          const size =
            Math.floor(
              Math.min(
                viewfinderWidth,
                viewfinderHeight
              ) * 0.65
            );

          return {
            width:size,
            height:size
          };

        },

        aspectRatio:1.0,

        disableFlip:false

      },

      handleQRScan,

      handleQRScanError

    );


    scannerRunning =
      true;


    stopBtn.disabled =
      false;


    startBtn.disabled =
      true;


    setConnectionStatus(
      'CAMERA: READY'
    );


    console.log(
      '[E-SAFE CAMERA] Started successfully.'
    );

  }
  catch(error){

    console.error(
      '[E-SAFE CAMERA ERROR]',
      error
    );


    scannerRunning =
      false;


    startBtn.disabled =
      false;


    stopBtn.disabled =
      true;


    setConnectionStatus(
      'CAMERA: ERROR'
    );


    alert(
      'Unable to start the camera.\n\n' +
      (
        error &&
        error.message
          ? error.message
          : error
      )
    );


    await destroyScanner();

  }

}


/* ==========================================================
   STOP CAMERA
========================================================== */

async function stopCamera(){

  if(
    !html5QrCode ||
    !scannerRunning
  ){

    return;

  }


  try{

    await html5QrCode.stop();

  }
  catch(error){

    console.warn(
      '[E-SAFE CAMERA STOP WARNING]',
      error
    );

  }


  scannerRunning =
    false;


  startBtn.disabled =
    false;


  stopBtn.disabled =
    true;


  setConnectionStatus(
    'CAMERA: STOPPED'
  );

}


/* ==========================================================
   DESTROY SCANNER
========================================================== */

async function destroyScanner(){

  if(!html5QrCode){

    return;

  }


  try{

    if(scannerRunning){

      await html5QrCode.stop();

    }

  }
  catch(error){

    console.warn(
      '[E-SAFE DESTROY STOP WARNING]',
      error
    );

  }


  try{

    await html5QrCode.clear();

  }
  catch(error){

    console.warn(
      '[E-SAFE DESTROY CLEAR WARNING]',
      error
    );

  }


  html5QrCode =
    null;

  scannerRunning =
    false;

}


/* ==========================================================
   QR SCAN CALLBACK
========================================================== */

function handleQRScan(
  decodedText,
  decodedResult
){

  if(scanLocked){

    return;

  }


  let token =
    String(
      decodedText || ''
    ).trim().toUpperCase();


  console.log(
    '[E-SAFE RAW QR VALUE]',
    JSON.stringify(
      decodedText
    )
  );


  /*
   * Some QR readers may return quotes.
   */

  token =
    token.replace(
      /^["']|["']$/g,
      ''
    );


  if(!token){

    return;

  }


  /*
   * Verify E-SAFE QR prefix.
   */

  if(
    !token.startsWith(
      QR_PREFIX
    )
  ){

    console.warn(
      '[E-SAFE INVALID QR]',
      token
    );

    return;

  }


  /*
   * CLIENT-SIDE PROTECTION
   *
   * This prevents html5-qrcode from
   * firing the same scan repeatedly.
   *
   * Server-side protection remains
   * authoritative.
   */

  const now =
    Date.now();


  if(
    token === lastScannedToken &&
    now - lastScanTime <
      CLIENT_COOLDOWN_MS
  ){

    console.log(
      '[E-SAFE CLIENT DUPLICATE BLOCK]'
    );

    return;

  }


  /*
   * Lock immediately.
   */

  scanLocked =
    true;


  lastScannedToken =
    token;


  lastScanTime =
    now;


  console.log(
    '[E-SAFE QR ACCEPTED]',
    token
  );


  recordAttendanceFromScanner(
    token
  );

}


/* ==========================================================
   QR SCAN ERROR
========================================================== */

function handleQRScanError(
  errorMessage
){

  /*
   * html5-qrcode generates many
   * "QR code not found" messages.
   *
   * Do not log them continuously.
   */

}


/* ==========================================================
   RECORD ATTENDANCE
========================================================== */

function recordAttendanceFromScanner(
  token
){

  const type =
    String(
      attendanceType.value ||
      'ENTRY'
    ).toUpperCase();


  showLoading(
    true,
    'Checking E-SAFE record...'
  );


  /*
   * IMPORTANT:
   *
   * This is JSONP.
   *
   * There is NO google.script.run here.
   */

  jsonpRequest(

    {
      api:'scanner',

      action:'scan',

      apiKey:API_KEY,

      qr:token,

      qrToken:token,

      token:token,

      type:type,

      scanner:SCANNER_NAME

    },

    function(response){

      console.log(
        '[E-SAFE SCAN RESPONSE]',
        response
      );


      showLoading(
        false
      );


      if(
        !response
      ){

        showErrorResult(
          'Empty response received from E-SAFE API.'
        );

        return;

      }


      /*
       * =====================================================
       * SUCCESS
       * =====================================================
       */

      if(
        response.success === true
      ){

        showSuccessResult(
          response
        );

        return;

      }


      /*
       * =====================================================
       * DUPLICATE
       * =====================================================
       */

      if(
        response.duplicate === true
      ){

        showDuplicateResult(
          response
        );

        return;

      }


      /*
       * =====================================================
       * NORMAL API ERROR
       * =====================================================
       */

      showErrorResult(

        response.message ||
        response.error ||
        'E-SAFE rejected the scan.'

      );

    },

    function(error){

      console.error(
        '[E-SAFE SCAN CONNECTION ERROR]',
        error
      );


      showLoading(
        false
      );


      /*
       * Show the REAL error.
       *
       * This makes debugging much easier.
       */

      showErrorResult(

        'Unable to connect to E-SAFE API.\n\n' +
        (
          error &&
          error.message
            ? error.message
            : String(error)
        )

      );

    }

  );

}


/* ==========================================================
   SUCCESS RESULT
========================================================== */

function showSuccessResult(
  response
){

  resultIcon.textContent =
    '✓';

  resultIcon.style.background =
    '#078a35';


  resultTitle.textContent =
    'ENTRY RECORDED';


  if(
    response.attendance &&
    response.attendance.type === 'EXIT'
  ){

    resultTitle.textContent =
      'EXIT RECORDED';

  }


  resultMessage.textContent =
    response.message ||
    'Attendance recorded successfully.';


  populateStudentInfo(
    response
  );


  resultModal.style.display =
    'flex';

}


/* ==========================================================
   DUPLICATE RESULT
========================================================== */

function showDuplicateResult(
  response
){

  resultIcon.textContent =
    '!';

  resultIcon.style.background =
    '#d99000';


  resultTitle.textContent =
    'DUPLICATE BLOCKED';


  resultMessage.textContent =
    response.message ||
    'This attendance scan was already recorded recently.';


  populateStudentInfo(
    response
  );


  resultModal.style.display =
    'flex';

}


/* ==========================================================
   ERROR RESULT
========================================================== */

function showErrorResult(
  message
){

  resultIcon.textContent =
    '×';

  resultIcon.style.background =
    '#b40000';


  resultTitle.textContent =
    'SCAN ERROR';


  resultMessage.textContent =
    message;


  studentInfo.style.display =
    'none';


  resultModal.style.display =
    'flex';

}


/* ==========================================================
   POPULATE STUDENT INFO
========================================================== */

function populateStudentInfo(
  response
){

  const student =
    response.student ||
    {};


  const attendance =
    response.attendance ||
    {};


  const previous =
    response.previousAttendance ||
    {};


  const name =
    student.name ||
    student.studentName ||
    student.STUDENT_NAME ||
    '';


  const lrn =
    student.lrn ||
    student.LRN ||
    '';


  const grade =
    student.grade ||
    student.GRADE ||
    '';


  const section =
    student.section ||
    student.SECTION ||
    '';


  const type =
    attendance.type ||
    previous.type ||
    attendanceType.value ||
    '';


  const time =
    attendance.time ||
    previous.time ||
    '';


  document.getElementById(
    'studentName'
  ).textContent =
    name;


  document.getElementById(
    'studentLRN'
  ).textContent =
    lrn;


  document.getElementById(
    'studentGrade'
  ).textContent =
    grade;


  document.getElementById(
    'studentSection'
  ).textContent =
    section;


  document.getElementById(
    'attendanceResultType'
  ).textContent =
    type;


  document.getElementById(
    'attendanceResultTime'
  ).textContent =
    time;


  studentInfo.style.display =
    'block';

}


/* ==========================================================
   LOADING
========================================================== */

function showLoading(
  visible,
  message
){

  loading.style.display =
    visible
      ? 'flex'
      : 'none';


  if(message){

    loadingText.textContent =
      message;

  }

}


/* ==========================================================
   CLOSE RESULT
========================================================== */

function closeResult(){

  resultModal.style.display =
    'none';


  studentInfo.style.display =
    'none';


  /*
   * Unlock scanning only after
   * user explicitly presses SCAN NEXT.
   */

  scanLocked =
    false;


  lastScannedToken =
    '';


  lastScanTime =
    0;


  if(scannerRunning){

    setConnectionStatus(
      'CAMERA: READY'
    );

  }

}


/* ==========================================================
   CLOSE SCANNER
========================================================== */

async function closeScanner(){

  await stopCamera();

  await destroyScanner();


  /*
   * GitHub Pages normally cannot be
   * closed by script unless opened by
   * script, so fall back to history.
   */

  try{

    window.close();

  }
  catch(e){}


  setTimeout(
    function(){

      if(
        window.history.length > 1
      ){

        window.history.back();

      }

    },
    100
  );

}


/* ==========================================================
   CAMERA CHANGE
========================================================== */

cameraSelect.addEventListener(
  'change',
  async function(){

    if(!scannerRunning){

      return;

    }


    await stopCamera();

    await destroyScanner();

    await startCamera();

  }
);


/* ==========================================================
   PAGE VISIBILITY
========================================================== */

document.addEventListener(
  'visibilitychange',
  async function(){

    if(
      document.hidden
    ){

      if(scannerRunning){

        await stopCamera();

      }

    }

  }
);


/* ==========================================================
   BEFORE UNLOAD
========================================================== */

window.addEventListener(
  'beforeunload',
  function(){

    if(
      html5QrCode &&
      scannerRunning
    ){

      html5QrCode
        .stop()
        .catch(
          function(){}
        );

    }

  }
);

</script>
